name: Lean proof verification

# Manual only: the builds are long. The Comparator workflow is the primary verification.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  modular:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      LEAN_NUM_THREADS: 2
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free disk space and add swap for the memory-heavy steps
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          bash comparator/add-swap.sh 16 3
      - name: Prepare the pinned Lean environment
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          lake-package-directory: lean
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
          use-github-cache: 'false'
      - name: Check publication copies and generated single-file source
        run: |
          python3 lean/scripts/check_publication.py
          python3 lean/scripts/make_lean4web.py --check
      - name: Build, audit axioms and compare the public statements
        working-directory: lean
        run: python3 scripts/verify.py
      - name: Replay every imported declaration in a fresh Lean environment
        working-directory: lean
        run: lake env lean --run scripts/Replay.lean

  without-comparator:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      LEAN_NUM_THREADS: 2
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free disk space and add swap for the memory-heavy steps
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          bash comparator/add-swap.sh 16 3
      - name: Prepare the pinned Lean environment
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          lake-package-directory: leanWithoutComparator
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
          use-github-cache: 'false'
      - name: Check that the copy is identical to lean/ and its record is current
        run: python3 lean/scripts/make_lean_without_comparator.py --check
      - name: Build the copy and audit its axioms
        run: python3 lean/scripts/verify_lean_without_comparator.py

  single-file:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      LEAN_NUM_THREADS: 2
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free disk space and add swap for the memory-heavy steps
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          bash comparator/add-swap.sh 16 3
      - name: Prepare the pinned Mathlib-only environment
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          lake-package-directory: lean4web
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
          use-github-cache: 'false'
      - name: Verify the generated source has not drifted
        run: python3 lean/scripts/make_lean4web.py --check
      - name: Compile and audit the complete single-file proof
        run: python3 lean/scripts/verify_lean4web.py
